; 미니 골리앗 크레인 펌웨어 (ESP32)
; 빌드:   pio run
; 업로드: pio run -t upload
; 모니터: pio device monitor -b 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    waspinator/AccelStepper@^1.64
    madhephaestus/ESP32Servo@^1.2.1
    bblanchon/ArduinoJson@^7.0.4
